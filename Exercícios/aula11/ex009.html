<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileiro ou Estrangeiro</title>
</head>
<body>
    <h1>Sistema Descobridor Se Você É Brasileiro Ou Estrangeiro</h1>
    Digite o seu país:  <input type="text" name="txtna" id="txtna">
    <input type="button" value="Verificar" onclick="descobrir()">
    <div id = 'res'>
    </div>
    <script>
        function descobrir() {
            var txtna = window.document.querySelector('input#txtna')
            var res = window.document.querySelector('div#res')
            if (txtna.value == 'Brasil') {
                res.innerHTML = 'Sua nacionalidade é Brasileira' 
            } else {
                res.innerHTML = 'Você é Estrangeiro (a)'
            }
        }
    </script>
</body>
</html>
